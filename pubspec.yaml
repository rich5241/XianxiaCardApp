name: xianxia_card_app
description: Xianxia Card Collection App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.2
  csv: ^6.0.0 # CSV 解析套件
  google_fonts: ^6.1.0  

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # 宣告自訂字型
  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/Humour-Normal.ttf

  assets:
    - assets/data/cards_data.csv
    - assets/images/
    - assets/Videos/